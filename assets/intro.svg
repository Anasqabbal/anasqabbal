<svg xmlns="http://www.w3.org/2000/svg" width="840" height="344" viewBox="0 0 840 344" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Terminal bio of Anas Qabbal</title>
  <desc id="desc">Software engineer. Systems, backend, full-stack. Focus: Software Engineer, Full Stack, Systems, Applied AI, DevOps. Stack: C, C++, JavaScript, TypeScript, Next.js, NestJS, Python, MySQL, PostgreSQL, Bash. Status: building resilient low-level and distributed systems.</desc>
  <defs>
    <style>
@font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url(data:font/ttf;base64,) format('truetype'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 700; src: url(data:font/ttf;base64,) format('truetype'); }
      text { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #EDEDED; }
      .b { font-weight: 700; }
      .n { fill: #39FF14; }
      .a { fill: #8A8A8A; }
      .e { fill: #EDEDED; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#141414" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="839" height="343" rx="4" fill="#0A0A0A"/>
  <rect x="0.5" y="0.5" width="839" height="343" rx="4" fill="url(#grid)" stroke="#262626" stroke-width="1"/>
  <circle cx="28" cy="24" r="5" fill="#39FF14"/>
  <circle cx="48" cy="24" r="5" fill="#262626"/>
  <circle cx="68" cy="24" r="5" fill="#262626"/>
  <line x1="1" y1="44" x2="839" y2="44" stroke="#262626" stroke-width="1"/>
  <text x="820" y="28" font-size="12" text-anchor="end"><tspan class="a">bash</tspan></text>
  <text x="32" y="76" font-size="15"><tspan class="n b">~/anasqabbal $ whoami</tspan></text>
  <text x="32" y="100" font-size="15">&gt; software engineer. systems, backend, full-stack.</text>
  <text x="32" y="136" font-size="15"><tspan class="n b">~/anasqabbal $ cat profile.json</tspan></text>
  <text x="32" y="160" font-size="15">{</text>
  <text x="56" y="184" font-size="15"><tspan class="a">"focus": </tspan><tspan class="e">["Software Engineer", "Full Stack", "Systems", "Applied AI", "DevOps"],</tspan></text>
  <text x="56" y="208" font-size="15"><tspan class="a">"stack": </tspan><tspan class="e">["C", "C++", "JavaScript", "TypeScript", "Next.js",</tspan></text>
  <text x="146.0" y="232" font-size="15"><tspan class="e">"NestJS", "Python", "MySQL", "PostgreSQL", "Bash"],</tspan></text>
  <text x="56" y="256" font-size="15"><tspan class="a">"status": </tspan><tspan class="n">"Building resilient low-level + distributed systems"</tspan></text>
  <text x="32" y="280" font-size="15">}</text>
  <text x="32" y="316" font-size="15"><tspan class="n b">~/anasqabbal $ </tspan></text>
  <rect class="cursor" x="167.0" y="304" width="9" height="16" fill="#39FF14" filter="url(#glow)"/>
</svg>
