<svg xmlns="http://www.w3.org/2000/svg" width="420" height="132" viewBox="0 0 420 132" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">SentinelRAG project card</title>
  <desc id="desc">Local-first security intelligence + codebase vulnerability engine (FastAPI, Qdrant, Ollama). Python · RAG · Cybersecurity.</desc>
  <defs>
    <style>
@font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url(data:font/ttf;base64,) format('truetype'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 700; src: url(data:font/ttf;base64,) format('truetype'); }
      text { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #EDEDED; }
      .b { font-weight: 700; }
      .n { fill: #39FF14; }
      .a { fill: #8A8A8A; }
      .e { fill: #EDEDED; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#141414" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="419" height="131" rx="4" fill="#0A0A0A"/>
  <rect x="0.5" y="0.5" width="419" height="131" rx="4" fill="url(#grid)" stroke="#262626" stroke-width="1"/>
  <text x="20" y="34" font-size="16"><tspan class="n b">&gt; SentinelRAG</tspan></text>
  <text x="400" y="34" font-size="12" text-anchor="end"><tspan class="a">01 / 04</tspan></text>
  <text x="20" y="62" font-size="13">Local-first security intelligence + codebase</text>
  <text x="20" y="82" font-size="13">vulnerability engine (FastAPI, Qdrant, Ollama)</text>
  <circle cx="25" cy="108" r="4" fill="#39FF14"/>
  <text x="36" y="112" font-size="12"><tspan class="a">Python · RAG · Cybersecurity</tspan></text>
</svg>
